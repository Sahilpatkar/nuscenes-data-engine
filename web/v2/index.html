<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Inline favicon: a page of type under a cobalt headline rule — the report
         edition's mark on paper. Keeps the page self-contained (no extra request,
         no 404 for /favicon.ico). -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23F7F5F0'/%3E%3Crect x='7' y='7' width='18' height='4' fill='%232447B2'/%3E%3Crect x='7' y='15' width='18' height='2' fill='%231A1C21'/%3E%3Crect x='7' y='20' width='18' height='2' fill='%231A1C21'/%3E%3Crect x='7' y='25' width='11' height='2' fill='%231A1C21'/%3E%3C/svg%3E"
    />
    <title>nuScenes Data Engine — report edition</title>
    <meta
      name="description"
      content="The nuScenes data-engine story as a research report: where the detector fails, which data fixes it, and whether the intervention worked — every number derived from the committed experiment package."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="nuScenes Data Engine — report edition" />
    <meta
      property="og:description"
      content="The nuScenes data-engine story as a research report: where the detector fails, which data fixes it, and whether the intervention worked — every number derived from the committed experiment package."
    />

    <!-- Pre-paint theme: runs before first paint so an explicit choice never flashes
         the other theme. No choice stored = follow the OS (tokens.css media query).
         Byte-identical to the root edition's script — both documents read the same
         "theme" key, so a choice made on one holds on the other. -->
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Source+Sans+3:wght@400;500;600&family=Source+Code+Pro:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/v2/main.tsx"></script>
  </body>
</html>
