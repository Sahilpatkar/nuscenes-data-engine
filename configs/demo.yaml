# Demo artifact-builder parameters (docs/superpowers/specs/2026-08-12-demo-phase1-design.md).
# The single place demo curation is parameterized; later phases add their sections.
paths:
  processed_dir: data/processed
  active_learning_dir: data/active_learning
  active_learning_config: configs/active_learning.yaml   # Phase 7: n_mine for
                      # al_communities.parquet's quota-sum check -- never re-typed
                      # in this file
  autolabel_dir: data/autolabel          # Phase 7 (consolidated review, C3): the
                      # Phase-6b VLM label table. `al pseudo-label` MERGES this
                      # with the weak run's own table before verifying, so
                      # vlm_counts.parquet must read both or frames the VLM did
                      # label come out all-NA. Optional: defaults to
                      # <DATA_DIR>/autolabel, the same expression pseudo_label.py
                      # computes.
  autolabel_weak_config: configs/autolabel_weak.yaml     # its `state.dir` is the
                      # weak run's OWN label table -- resolved from the config the
                      # run reads, never hardcoded here. Optional: defaults to
                      # <active_learning_dir>/autolabel_weak.
  mlruns_dir: mlruns
  lancedb_path: data/lancedb
  lancedb_table: frames
  out_dir: demo_data

models:              # MLflow run ids (weights + artifacts live under mlruns/artifacts/<id>/)
                      # + the imgsz each checkpoint was trained at (must match, or the
                      # comparison silently handicaps whichever model is under-scaled --
                      # see each run's mlruns/artifacts/<id>/artifacts/ultralytics_run/args.yaml)
  baseline:
    run: e465844a6b0249a3bc08ae894e530b22
    imgsz: 640
  graph_rate_night:
    run: b7e251d4fb624097bea3d4e9e4a80c62
    imgsz: 640
  champion:           # yolov8m, the third of Task 5's three checkpoints
    run: 3869d068100a4af6a274c6d134feed2f
    imgsz: 960

hero:                # Phase 3: a hand-picked exemplar crop token from the curated-
                      # frames group (demo_data/sample_frames/crops/<token>.jpg),
                      # not an mlruns mosaic -- see the dated amendment in
                      # docs/superpowers/specs/2026-08-12-demo-phase1-design.md.
                      # `demo build` fails loudly on a null token ONLY once curation
                      # is included -- a null token is fine (and expected) while
                      # curation is absent, e.g. a fresh clone. See docs/DEMO.md's
                      # "Picking the hero token" section.
  token: 5994f34b836043b3b5be191bceba2e3e         # picked in the Task-5 operational run from the
                      # fixes_fn_vs_baseline_graph_rate_night exemplars -- if you pick
                      # a different token, also update app/demo/views/overview.py's
                      # _HERO_CAPTION to describe what it actually shows

budgets:
  max_package_mb: 100

flagship:
  expected_sql_count: 30
  cypher_count: 30                 # fallback, overwritten when subgraphs staged
  cypher_source: docs/GRAPH.md

presets:                          # Phase 5: demo/events.py's six scenario presets
                                   # (docs/superpowers/specs/2026-08-20-demo-phase5-design.md §1)
  cap_per_preset: 30
  near_dist_m: 10.0                # matches exporters.py::FLAGSHIP_SQL's hardcoded "< 10"
  high_speed_mps: 10.0
  model_for_results: baseline      # which model's matched_<model>/predictions the two
                                    # model-result presets (fn_pedestrians_night,
                                    # low_conf_braking) key off

semsearch:                        # Phase 5: `demo semsearch` (torch required) -- recorded
                                   # SigLIP queries -> semantic_search_results.parquet,
                                   # copied into the package by `demo build`'s
                                   # _include_semsearch (see demo/exporters.py::export_semsearch)
  queries:
    - foggy road with heavy lens glare
    - crowded nighttime pedestrian crossing
    - pedestrian crossing at a red light at night
    - construction zone with traffic cones
  k: 8
  oversample: 16                  # consolidated review (item 7): the LanceDB store
                                   # spans all six camera channels, and 8x sometimes
                                   # left fewer than k CAM_FRONT hits for a query;
                                   # exporters.export_semsearch defaults to 8 when
                                   # this key is absent.

curation:
  staging_dir: data/demo_curation
  images_root: data/raw/demo_frames   # rsync destination (demo infer resolves images here)
  quotas:
    night_failure: 60
    day_failure: 40
    hard_braking: 40
    al_selected: 30
    weak_accepted: 20
    weak_rejected: 20
    clean_success: 20
    semantic: 20
  semantic_queries:
    - foggy road with heavy lens glare
    - crowded nighttime pedestrian crossing
  weak_arm: graph_rate_night
  al_arm: graph_rate_night
  crop_size: [960, 540]

al:                               # Phase 7: Active Learning page
  arm: graph_rate_night
  baseline: baseline
  community_arms: [graph_rate, graph_rate_night]
  exemplar_tokens:                # hand-approved val frames: `arm` reaches a confident detection `baseline` missed or only low-conf claimed
    - 00ec313e03a34216b14ae025674a953a   # night, scene-1071: pedestrian 26 m, low-conf 0.30 -> 0.47
    - c25ac25cdd7e43208447a9030c7049ae   # night, scene-1069: truck 11 m none -> 0.42; car 23 m 0.15 -> 0.55
    - b08a2deaf871433fad9a4c03e6f53d32   # day bus stop: two pedestrians 0.18 -> 0.67, 0.35 -> 0.46
    - 1ee6165c9091483bb384d02b78e92c5a   # day crosswalk: pedestrian 19 m 0.16 -> 0.62
    - 524d443c501a4f98a14508c3fb6f6de3   # day campus: pedestrian 26 m 0.33 -> 0.64 (champion only 0.35)
    - 9a662c4898d14a6c9246f504c3a7d835   # day cafe: pedestrian 22 m 0.39 -> 0.63 (champion 0.36)
