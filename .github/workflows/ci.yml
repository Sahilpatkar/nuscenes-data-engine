name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      # data + engine extras so the ingestion/validation/monitoring/data-engine unit
      # tests run; train extra (torch) stays out — its tests skip via importorskip.
      # serve extra is in too: it's torch-free (just streamlit/fastapi/uvicorn) and
      # without it `streamlit.*` falls back to the mypy override's ignore_missing_imports
      # (Any), which silently passes strict `disallow_untyped_decorators` on the wrong
      # thing — the seven @st.cache_data loaders in app/demo/data.py need the real
      # streamlit types for that check to mean anything.
      - name: Install deps (base + dev + data + engine + serve)
        run: uv sync --extra dev --extra data --extra engine --extra serve

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy)
        run: uv run mypy

      - name: Tests (pytest)
        run: uv run pytest

  smoke-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      # uv.lock pins the CUDA torch build for linux (the GPU server); this job wants the
      # small CPU wheel, so install torch/ultralytics outside the lock. Versions mirror
      # uv.lock (torch 2.13.0 / ultralytics 8.4.96) — keep in sync when relocking.
      - name: Install deps (base + dev, CPU torch outside the lock)
        run: |
          uv sync --extra dev
          uv pip install --torch-backend=cpu "torch==2.13.0" "ultralytics==8.4.96"

      - name: Sanity-check train stack
        run: uv run --no-sync python -c "import torch, ultralytics; print(torch.__version__)"

      - name: Cache yolov8n.pt
        uses: actions/cache@v4
        with:
          path: weights/yolov8n.pt
          key: yolov8n-pt

      - name: 1-epoch CPU smoke train
        run: uv run --no-sync pytest -m smoke_train tests/test_smoke_train.py -rA

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The story site's numbers are not checked here: they live in the committed
      # bundle (web/src/data/, web/public/story/), which the quality job's
      # tests/test_web_export.py guards byte-for-byte against demo_data/. This job
      # only proves the site still type-checks and builds — with the Pages base path,
      # so a base-sensitive asset ref breaks here rather than after a deploy.
      - name: Install deps (npm ci)
        working-directory: web
        run: npm ci

      - name: Type-check (tsc)
        working-directory: web
        run: npm run typecheck

      - name: Build (vite)
        working-directory: web
        run: npm run build
        env:
          BASE_PATH: /nuscenes-data-engine/
