name: Deploy story site

# The story site (web/) is a static Vite build over a COMMITTED data bundle
# (web/src/data/*.json + web/public/story/*.jpg, produced by web/build_data.py).
# That is why this workflow is hermetic — no Python, no demo_data/, no exporter run:
# the committed bundle is the contract, and ci.yml's quality job guards it by
# re-running the exporter and asserting byte-equality (tests/test_web_export.py).
# A deploy therefore cannot invent a number the test suite has not already seen.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps (npm ci)
        working-directory: web
        run: npm ci

      # Project site, so every asset URL is prefixed with the repo name.
      - name: Build (vite)
        working-directory: web
        run: npm run build
        env:
          BASE_PATH: /nuscenes-data-engine/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
